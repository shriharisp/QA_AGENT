version: 1.0.8
cache: true

interface:
  privacyPolicy:
    externalUrl: 'https://librechat.ai/privacy-policy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://librechat.ai/tos'
    openNewTab: true

# Custom LLM Endpoints (Connecting local Ollama)
endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1"
      models:
        default: ["qwen2.5-coder", "llama3.2", "deepseek-r1:8b", "qwen3:8b"]
        fetch: true
      titleConvo: true
      titleModel: "qwen2.5-coder"
      summarize: true
      summaryModel: "qwen2.5-coder"
      forcePrompt: false

# Model Context Protocol (MCP) Servers Integration
mcpServers:
  playwright:
    type: sse
    url: "http://playwright-mcp:8931/sse"
    description: "Playwright Browser Automation Tool for E2E Web QA Testing, DOM inspection, clicking buttons, filling input fields, running assertions, and capturing screenshots."
